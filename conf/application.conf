# Mongo infra is pre-wired (docker-compose.yml). Rename the database per project.
mongo {
  uri = "mongodb://localhost:27017"
  database = "play-template"
}

# ─── Lesson 6: upstreams live in config, not in code ───
upstreams {
  jsonplaceholder {
    base-url = "https://jsonplaceholder.typicode.com"
    timeout  = 5 seconds
  }
  httpbin {
    base-url = "https://httpbin.org"
    timeout  = 10 seconds
    # dev default, overridden by an env var when it is set (HOCON ${?VAR} syntax)
    api-key  = "dev-key-123"
    api-key  = ${?HTTPBIN_API_KEY}
  }
}

# ─── Global WSClient settings (apply to every call) ───
play.ws {
  useragent = "playwscli/1.0 (lesson 6)"
  timeout.connection = 3 seconds
  timeout.idle       = 30 seconds
  timeout.request    = 30 seconds
}
